# Babble-Bridge cdc-acm loader: /etc files to carry over on SteamOS atomic updates.
# The unit and its enable link already match the default keep list (/etc/systemd/system/*.service,
# *.wants/**); they are listed so the loader does not depend on that. The udev rule is kept only
# because of this file. The module store and the helpers live in /var/lib/babble-tracker, which
# holo-sync-var copies to the new slot without any list.
/etc/atomic-update.conf.d/babble-tracker.conf
/etc/systemd/system/babble-cdc-acm.service
/etc/systemd/system/multi-user.target.wants/babble-cdc-acm.service
/etc/udev/rules.d/70-babble-tracker.rules
